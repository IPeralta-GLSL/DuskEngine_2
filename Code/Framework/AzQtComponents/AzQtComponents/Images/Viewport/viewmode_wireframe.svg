<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" xml:space="preserve">
<!-- outer quad -->
<polygon points="8,2 14,5.5 14,10.5 8,14 2,10.5 2,5.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<!-- inner diagonals / triangulation giving wireframe mesh feel -->
<line x1="8" y1="2"  x2="14" y2="10.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="8" y1="2"  x2="2"  y2="10.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="2" y1="5.5" x2="14" y2="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="2" y1="10.5" x2="14" y2="10.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
